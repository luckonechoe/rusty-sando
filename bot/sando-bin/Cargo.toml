[package]
name = "rusty-sando"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Optimized sandwich bot written using Rust and Huff"
readme = "README.md"
homepage = "https://github.com/mouseless-eth/rusty-sando"
repository = "https://github.com/mouseless-eth/rusty-sando"
keywords = ["Ethereum", "Mev", "Dex", "Sandwich"]
authors = ["0xmouseless <https://github.com/mouseless-eth>"]

# Phase 1 dep skeleton: ethers, ethers-flashbots, cfmms removed.
# Alloy v1 / revm v33 are the new EVM stack. Flashbots integration is
# planned to be a thin local FlashbotsClient (alloy PrivateKeySigner +
# reqwest) per skill-updates/flashbots-mev.md — no separate crate needed
# yet. References to ethers / cfmms / ethers_flashbots in src/ become
# real type errors in cargo check (expected, fixed in Phase 2+).

[dependencies]
dotenv    = { workspace = true }
hashbrown = { workspace = true }
tokio     = { workspace = true }
log       = { workspace = true }
url       = { workspace = true }
dashmap   = { workspace = true }
hex       = { workspace = true }
serde     = { workspace = true }
anyhow    = { workspace = true }
reqwest   = { workspace = true }
thiserror = { workspace = true }
futures   = { workspace = true }

# EVM stack
alloy = { workspace = true }
revm  = { workspace = true }

# logging
indoc   = { workspace = true }
fern    = { workspace = true }
chrono  = { workspace = true }
colored = { workspace = true }

# artemis related
artemis-core = { path = "../crates/artemis-core" }
strategy     = { path = "../crates/strategy" }
