[package]
name = "artemis-core"
version = "0.1.0"
edition = "2021"

# Phase 1 dep skeleton: ethers + ethers-flashbots removed.
# Alloy v1 / revm v33 surface area pulled from the workspace dep table.
# Source code under src/ still references ethers types — those become
# real type/import errors in cargo check (expected, fixed in Phase 2+).

[dependencies]
## eth
alloy = { workspace = true }

## async
async-trait  = { workspace = true }
reqwest      = { workspace = true }
tokio        = { workspace = true }
tokio-stream = { workspace = true }
futures      = { workspace = true }

## misc
anyhow    = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

[features]
default = []
# Enables integration tests that spawn an Anvil node. Requires the `anvil`
# binary on PATH. Off by default so plain `cargo check` / `cargo build` works.
live = []
