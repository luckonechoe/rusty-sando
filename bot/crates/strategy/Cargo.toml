[package]
name = "strategy"
version = "0.1.0"
edition = "2021"

# Phase 1 dep skeleton.
# Removed: cfmms (mouseless-eth/cfmms-rs, dead 404), foundry-evm + anvil
# (mouseless-eth/foundry, dead 404), ethers, ethers-flashbots, eth-encode-packed.
# Added: alloy v1, revm v33.
# Source under src/ still references those old crates → type/import errors
# in cargo check (expected — fixed in Phase 2+).

[dependencies]
# Misc
hashbrown   = { workspace = true }
tokio       = { workspace = true }
dashmap     = { workspace = true }
thiserror   = { workspace = true }
futures     = { workspace = true }
async-trait = { workspace = true }
anyhow      = { workspace = true }
serde       = { workspace = true }
once_cell   = "1"
hex         = { workspace = true }

# EVM stack (alloy v1 + revm v33 replaces ethers / foundry-evm / cfmms / anvil)
alloy = { workspace = true }
revm  = { workspace = true }

# Logging
colored   = { workspace = true }
log       = { workspace = true }
indicatif = { workspace = true }

# Artemis
artemis-core = { path = "../artemis-core" }

[dev-dependencies]
fern = { workspace = true }

[features]
debug = []
# Sim-only surface (lil_router_interface). Gated so default-features builds
# don't compile the simulator-facing encoder. The huff_sando_interface
# encoders themselves are always compiled.
simulate = []
